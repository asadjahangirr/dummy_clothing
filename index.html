<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ÆTHER</title>
  <meta name="description" content="Walk through the ÆTHER boutique in real-time 3D." />
  <meta name="theme-color" content="#eeede9" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230b0b0c%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2232%22 text-anchor=%22middle%22 fill=%22%23fff%22%3E%C3%86%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="preload" href="/models/shirt.glb" as="fetch" type="model/gltf-binary" crossorigin />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="is-loading">

  <!-- intro: a hanger draws itself as the store loads, then the doors slide open -->
  <div class="loader" id="loader" aria-hidden="true">
    <i class="loader__door loader__door--l"></i>
    <i class="loader__door loader__door--r"></i>
    <div class="loader__swing">
      <svg class="loader__hanger" viewBox="0 0 200 130">
        <path pathLength="1" d="M100 52 V40 C100 33 111 31 111 21 C111 12 103 7 96 9 C90 11 88 16 89 21" />
        <path pathLength="1" d="M100 52 L24 104 C16 110 19 116 28 116 H172 C181 116 184 110 176 104 Z" />
      </svg>
    </div>
    <span class="loader__mark">ÆTHER</span>
  </div>

  <canvas id="stage" class="stage" aria-label="The ÆTHER boutique in 3D. Scroll to walk through the store. Grab a shirt to move it on the rail."></canvas>

  <header class="top">
    <a href="#s0" class="brand" data-go="0" aria-label="ÆTHER — back to the entrance">ÆTHER</a>
    <button class="bag-btn" id="bagBtn" aria-label="Open bag">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13l-1 12.5h-11z" /><path d="M9 8V6.5a3 3 0 0 1 6 0V8" /></svg>
      <b id="bagCount">0</b>
    </button>
  </header>

  <!-- the page scroll drives the walk through the store: one screen per stop -->
  <main class="walk" id="walk">
    <section id="s0" data-station="0"></section>
    <section id="s1" data-station="1"></section>
    <section id="s2" data-station="2"></section>
    <section id="s3" data-station="3"></section>
    <section id="s4" data-station="4"></section>
    <section id="s5" data-station="5"></section>
  </main>

  <aside class="product" id="product" aria-label="Product" aria-hidden="true">
    <button class="product__close" id="pClose" aria-label="Close">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" /></svg>
    </button>
    <span class="product__idx mono" id="pIdx">01 / 03</span>
    <h2 class="product__name" id="pName"></h2>
    <span class="product__price" id="pPrice"></span>
    <div class="sizes" id="sizes" role="radiogroup" aria-label="Size"></div>
    <button class="btn" id="addBtn"><span>Add to bag</span></button>
  </aside>

  <aside class="bag" id="bag" aria-label="Bag" aria-hidden="true">
    <header class="bag__head">
      <button class="icon-btn" id="bagBack" aria-label="Back to the store">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <h2>Bag <span class="mono muted" id="bagCountLabel"></span></h2>
    </header>
    <ul class="bag__items" id="bagItems"></ul>
    <p class="bag__empty muted" id="bagEmpty">Empty</p>
    <footer class="bag__foot">
      <div class="bag__total"><span class="muted">Subtotal</span><span id="bagSubtotal"></span></div>
      <button class="btn" id="checkoutBtn"><span>Checkout</span></button>
    </footer>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
