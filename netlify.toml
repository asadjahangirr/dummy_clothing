[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# hashed JS/CSS bundles never change, so browsers can cache them forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# the 3D model is cached for a week (rename the file if you replace it)
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# room models, textures and lighting (rename a file if you replace it)
[[headers]]
  for = "/store/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
